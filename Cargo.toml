[package]
name = "ghostmice"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Minimal Windows zero-delta synthetic mouse activity experiment"

[dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
